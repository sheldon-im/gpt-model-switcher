[package]
name = "gpt-model-switcher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gpt-model-switcher"
path = "src/main.rs"

[dependencies]
switcher-core = { path = "../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.1", features = ["tray-icon"] }
tauri-runtime = "=2.11.1"
tauri-runtime-wry = "=2.11.1"
tauri-utils = "=2.9.1"
tauri-macros = "=2.6.1"

[build-dependencies]
tauri-build = { version = "=2.6.1", features = [] }
