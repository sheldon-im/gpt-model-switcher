[package]
name = "gpt-model-switcher"
version = "0.1.4"
edition = "2021"

[[bin]]
name = "gpt-model-switcher"
path = "src/main.rs"

[dependencies]
switcher-core = { path = "../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tauri = { version = "=2.11.1", features = ["tray-icon"] }
tauri-runtime = "=2.11.1"
tauri-runtime-wry = "=2.11.1"
tauri-utils = "=2.9.1"
tauri-macros = "=2.6.1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader"] }

[build-dependencies]
tauri-build = { version = "=2.6.1", features = [] }

[target.'cfg(target_os="macos")'.dependencies]
objc2 = "0.6"
